name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

env:
  TWENTY_VERSION: v2.45.0
  TWENTY_API_URL: http://localhost:2021
  TWENTY_API_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..Ow8z-Dptg4LDiO2nApu5UQcX2a-gXdu_McalWs7Pgt8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Twenty test instance
        shell: bash
        run: |
          docker run -d             --name twenty-app-dev-test             -p 2021:2021             -e NODE_PORT=2021             -e SERVER_URL=http://localhost:2021             -e MARKETPLACE_CATALOG_SYNC_CRON_ENABLED=false             -e API_RATE_LIMITING_SHORT_LIMIT=100000             -e API_RATE_LIMITING_LONG_LIMIT=100000             twentycrm/twenty-app-dev:${TWENTY_VERSION}

          echo "Waiting for Twenty test instance..."
          timeout 180 bash -c 'until curl -sf http://localhost:2021/healthz >/dev/null; do sleep 3; done'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Integration tests
        run: yarn test

      - name: Twenty logs on failure
        if: failure()
        run: docker logs twenty-app-dev-test 2>&1 | tail -150 || true
